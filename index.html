<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
        #chat { width: 420px; max-width: 50%; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
        #log { flex: 1; overflow-y: auto; padding: 12px; }
        .msg { margin: 0 0 10px; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
        .user { background: #e3f0ff; margin-left: 40px; }
        .bot { background: #f3f3f3; margin-right: 20px; }
        .tools { font-size: 12px; color: #666; margin: -4px 0 10px; }
        #form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #ddd; }
        #q { flex: 1; padding: 8px; }
        #map { flex: 1; }
        @media (max-width: 700px) { body { flex-direction: column-reverse; } #chat { width: 100%; max-width: 100%; height: 60%; } #map { height: 40%; } }
    </style>
</head>
<body>
    <div id="chat">
        <div id="log">
            <div class="msg bot">안녕하세요! 제주 여행 추천 에이전트예요. 날씨와 장소 목록을 직접 조회해서 추천해 드려요.
예) "내일 서귀포에서 가족이랑 갈 만한 곳 추천해줘"</div>
        </div>
        <form id="form">
            <input id="q" placeholder="어디서 뭘 하고 싶으세요?" autocomplete="off">
            <button>보내기</button>
        </form>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // jeju_spots.json 에 좌표가 없어서 지역 중심 근처에 대략 찍는다.
        const CENTERS = {
            "동쪽(성산)": [33.4580, 126.9420], "동쪽(구좌)": [33.5200, 126.8500],
            "제주시": [33.4996, 126.5312], "서쪽(한림)": [33.4140, 126.2670],
            "서쪽(안덕)": [33.2600, 126.3100], "서귀포": [33.2541, 126.5601],
        };

        const map = L.map("map").setView([33.38, 126.55], 10);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);
        const layer = L.layerGroup().addTo(map);

        const jitter = (name, k) => {
            let h = 0;
            for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 1000;
            return ((h + k * 377) % 1000) / 1000 * 0.06 - 0.03;
        };

        function plot(spots) {
            layer.clearLayers();
            const points = [];
            for (const s of spots) {
                const c = CENTERS[s.area];
                if (!c) continue;
                const p = [c[0] + jitter(s.name, 1), c[1] + jitter(s.name, 2)];
                points.push(p);
                L.marker(p).addTo(layer).bindPopup(
                    `<b>${s.name}</b><br>${s.area} · ${s.indoor ? "실내" : "야외"}<br>${s.description}`);
            }
            if (points.length) map.fitBounds(points, { padding: [40, 40] });
        }

        const log = document.getElementById("log");
        const history = [];

        function add(cls, text) {
            const d = document.createElement("div");
            d.className = "msg " + cls;
            d.textContent = text;
            log.appendChild(d);
            log.scrollTop = log.scrollHeight;
            return d;
        }

        document.getElementById("form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("q");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            add("user", text);
            history.push({ role: "user", content: text });
            const wait = add("bot", "날씨와 장소를 찾는 중…");

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ messages: history }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || res.status);

                wait.textContent = data.reply;
                history.push({ role: "assistant", content: data.reply });
                if (data.toolLog.length) {
                    const t = document.createElement("div");
                    t.className = "tools";
                    t.textContent = "🔧 사용한 도구: " + data.toolLog
                        .map((x) => `${x.name}(${Object.values(x.input).join(", ")})`).join(" → ");
                    log.appendChild(t);
                }
                plot(data.spots);
            } catch (err) {
                wait.textContent = "오류: " + err.message;
                history.pop();
            }
            log.scrollTop = log.scrollHeight;
        });
    </script>
</body>
</html>
