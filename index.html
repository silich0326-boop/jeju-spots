<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광지 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #bar { padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #map { height: calc(100vh - 90px); }
        #msg { padding: 0 8px 6px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="bar">
        <select id="area">
            <option>동쪽</option>
            <option>서쪽</option>
            <option>서귀포</option>
            <option>제주시</option>
        </select>
        <select id="indoor">
            <option value="">실내·야외 전체</option>
            <option value="true">실내</option>
            <option value="false">야외</option>
        </select>
        <button id="find">찾기</button>
    </div>
    <div id="msg"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const MAX_RESULTS = 8;

        // jeju_spots.json 에 좌표가 없어서, 목록의 area 별 대략적인 중심 위치를 쓴다.
        const CENTERS = {
            "동쪽(성산)": [33.4580, 126.9420],
            "동쪽(구좌)": [33.5200, 126.8500],
            "제주시":     [33.4996, 126.5312],
            "서쪽(한림)": [33.4140, 126.2670],
            "서쪽(안덕)": [33.2600, 126.3100],
            "서귀포":     [33.2541, 126.5601],
        };

        const map = L.map("map").setView([33.38, 126.55], 10);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);
        const layer = L.layerGroup().addTo(map);

        // api/tools.js 의 find_spots 와 같은 규칙 (브라우저에서는 require 를 못 써서 옮겨 둠)
        const findSpots = (spots, area, indoor) =>
            spots
                .filter((s) => s.area === area || s.area.startsWith(area + "("))
                .filter((s) => indoor === undefined || s.indoor === indoor);

        // 같은 지역 마커가 한 점에 겹치지 않게 이름으로 정한 작은 어긋남을 준다.
        const jitter = (name, k) => {
            let h = 0;
            for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 1000;
            return ((h + k * 377) % 1000) / 1000 * 0.06 - 0.03;
        };

        async function show() {
            const area = document.getElementById("area").value;
            const v = document.getElementById("indoor").value;
            const indoor = v === "" ? undefined : v === "true";

            const res = await fetch("jeju_spots.json");
            const { spots } = await res.json();
            const found = findSpots(spots, area, indoor);
            const shown = found.slice(0, MAX_RESULTS);

            layer.clearLayers();
            const points = [];
            for (const s of shown) {
                const [lat, lng] = CENTERS[s.area];
                const p = [lat + jitter(s.name, 1), lng + jitter(s.name, 2)];
                points.push(p);
                L.marker(p).addTo(layer)
                    .bindPopup(`<b>${s.name}</b><br>${s.area} · ${s.indoor ? "실내" : "야외"}<br>${s.type}`);
            }
            if (points.length) map.fitBounds(points, { padding: [40, 40] });
            document.getElementById("msg").textContent =
                `${found.length}곳 중 ${shown.length}곳 표시 (위치는 지역 중심 기준 대략값)`;
        }

        document.getElementById("find").addEventListener("click", show);
        show();
    </script>
</body>
</html>
