<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지진 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; background: #0b1020; color: #e8ecf8; }
        #bar { padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        h1 { font-size: 18px; margin: 0 8px 0 0; }
        select, button { padding: 5px 8px; border-radius: 6px; border: 1px solid #3a4468; background: #161d36; color: #e8ecf8; }
        #stats { padding: 0 12px 8px; font-size: 14px; }
        #stats b { color: #ffd166; }
        #wrap { position: relative; }
        #map { height: calc(100vh - 100px); background: #0b1020; }
        .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); }
        #legend { position: absolute; right: 10px; bottom: 24px; z-index: 1000; background: rgba(11,16,32,.85);
                  padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.7; }
        #legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    </style>
</head>
<body>
    <div id="bar">
        <h1>🌍 실시간 지진 지도</h1>
        <select id="feed">
            <option value="all_hour">지난 1시간 (전체)</option>
            <option value="all_day" selected>지난 24시간 (전체)</option>
            <option value="4.5_week">지난 7일 (규모 4.5 이상)</option>
        </select>
        <button id="reload">새로고침</button>
    </div>
    <div id="stats">불러오는 중…</div>
    <div id="wrap">
        <div id="map"></div>
        <div id="legend">
            <b>깊이</b><br>
            <i style="background:#ff4d4d"></i>0~30km (얕음)<br>
            <i style="background:#ffa94d"></i>30~70km<br>
            <i style="background:#ffe066"></i>70~150km<br>
            <i style="background:#4dd2ff"></i>150~300km<br>
            <i style="background:#9b6bff"></i>300km~ (깊음)<br>
            <span>원이 클수록 규모가 커요</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const URL_BASE = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/";

        const map = L.map("map", { worldCopyJump: true }).setView([20, 140], 2);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors | 데이터: USGS",
            maxZoom: 10,
            className: "dark-tiles",
        }).addTo(map);
        const layer = L.layerGroup().addTo(map);

        const colorByDepth = (km) =>
            km < 30 ? "#ff4d4d" : km < 70 ? "#ffa94d" : km < 150 ? "#ffe066" : km < 300 ? "#4dd2ff" : "#9b6bff";

        async function load() {
            const feed = document.getElementById("feed").value;
            const stats = document.getElementById("stats");
            stats.textContent = "불러오는 중…";
            try {
                const res = await fetch(URL_BASE + feed + ".geojson");
                const data = await res.json();
                layer.clearLayers();

                let strongest = null;
                for (const f of data.features) {
                    const [lng, lat, depth] = f.geometry.coordinates;
                    const { mag, place, time } = f.properties;
                    if (mag == null) continue;
                    if (!strongest || mag > strongest.properties.mag) strongest = f;

                    L.circleMarker([lat, lng], {
                        radius: Math.max(3, mag * 3.2),
                        color: colorByDepth(depth),
                        fillColor: colorByDepth(depth),
                        fillOpacity: 0.45,
                        weight: 1.5,
                    }).addTo(layer).bindPopup(
                        `<b>규모 ${mag}</b><br>${place}<br>깊이 ${depth.toFixed(0)}km<br>` +
                        new Date(time).toLocaleString("ko-KR")
                    );
                }

                const s = strongest && strongest.properties;
                stats.innerHTML = `총 <b>${data.features.length}</b>건` +
                    (s ? ` · 가장 큰 지진 <b>규모 ${s.mag}</b> (${s.place})` : "") +
                    ` · 갱신 ${new Date().toLocaleTimeString("ko-KR")}`;
            } catch (e) {
                stats.textContent = "데이터를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
            }
        }

        document.getElementById("feed").addEventListener("change", load);
        document.getElementById("reload").addEventListener("click", load);
        setInterval(load, 5 * 60 * 1000);  // 5분마다 자동 갱신
        load();
    </script>
</body>
</html>
